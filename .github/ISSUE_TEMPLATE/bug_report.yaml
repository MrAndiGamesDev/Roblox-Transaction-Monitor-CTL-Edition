name: Bug Report
title: "[BUG] "
description: Report a problem you're having
body:
  - type: input
    id: version
    attributes:
      label: Roblox Transaction Monitor CTL Edition Version
      description: "What version of Roblox Transaction Monitor CTL Edition are you using?"
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What problem did you encounter?
      description: Provide a comprehensive description of the problem you're facing. Don't forget to attach any additional resources you may have, such as log files and screenshots.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: How do you reproduce the problem?
      description: Include the steps to reproduce the problem from start to finish. Include details such as settings you changed or transactions you monitored.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
  - type: textarea
    id: log
    attributes:
      label: Roblox Transaction Monitor Log
      description: If you're getting an error, upload your log file here. Otherwise, just leave it empty.
      value: "N/A"
      render: text
